version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuldeep_portfolio_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/kuldeep_portfolio
      - JWT_ACCESS_SECRET=d8a4f91c6e2b5a3f7c1e8d9b0a2f4c6e8b0a2f4c6e8b0a2f4c6e8b0a2f4c6e8b
      - JWT_REFRESH_SECRET=b0a2f4c6e8b0a2f4c6e8b0a2f4c6e8b0d8a4f91c6e2b5a3f7c1e8d9b0a2f4c6e
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - ADMIN_NAME=Kuldeep Sen
      - ADMIN_EMAIL=admin@kuldeepsen.com
      - ADMIN_PASSWORD=SuperSecureAdminPassword123!
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - portfolio_net

  mongodb:
    image: mongo:7.0
    container_name: kuldeep_portfolio_db
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  portfolio_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
